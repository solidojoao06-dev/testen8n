<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <title>Cadastro - Loja de Impressões 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Impressões 3D Incríveis</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="#">Produtos</a>
            <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
            <a href="login.html">Login / Cadastre-se</a>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <h2>Crie sua Conta</h2>
            <form id="register-form" onsubmit="event.preventDefault(); alert('Funcionalidade de cadastro (UI) acionada.');">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="auth-btn">Cadastrar</button>
            </form>
            <p class="auth-switch">Já tem uma conta? <a href="login.html">Faça login</a></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Loja de Impressões 3D</p>
    </footer>

    <!-- Estrutura do Popup Promocional -->
    <div id="promo-popup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close">&times;</button>
            <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='600'%20height='300'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%23e9ecef'/%3E%3Ctext%20x='50%25'%20y='50%25'%20font-family='Arial'%20font-size='24'%20fill='%23495057'%20dominant-baseline='middle'%20text-anchor='middle'%3EBanner%20da%20Promoção%20Aqui%3C/text%3E%3C/svg%3E" alt="Promoção">
        </div>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
