<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras - Tabacaria Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Tabacaria Online</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
            <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="cart-container">
        <h2>Seu Carrinho de Compras</h2>
        <div id="cart-items-container">
            <!-- Itens do carrinho serão inseridos aqui pelo JavaScript -->
        </div>
        <div id="cart-summary">
            <h3>Total: R$ <span id="cart-total">0.00</span></h3>
            <button id="clear-cart-btn">Limpar Carrinho</button>
            <button id="checkout-btn">Finalizar Compra</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Tabacaria Online</p>
    </footer>

    <script src="js/script.js"></script>

</html>
