<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <title>Carrinho de Compras - Loja de Impressões 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Impressões 3D Incríveis</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
            <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main class="cart-container">
        <h2>Seu Carrinho de Compras</h2>
        <div id="cart-items-container">
            <!-- Itens do carrinho serão inseridos aqui pelo JavaScript -->
        </div>
        <div id="cart-summary">
            <h3>Total: R$ <span id="cart-total">0.00</span></h3>
            <button id="clear-cart-btn">Limpar Carrinho</button>
            <button id="checkout-btn">Finalizar Compra</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Loja de Impressões 3D</p>
    </footer>

    <script src="js/script.js"></script>

    <!-- Estrutura do Popup Promocional -->
    <div id="promo-popup" class="popup-overlay">
        <div class="popup-content">
            <button class="popup-close">&times;</button>
            <img src="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='600'%20height='300'%3E%3Crect%20width='100%25'%20height='100%25'%20fill='%23e9ecef'/%3E%3Ctext%20x='50%25'%20y='50%25'%20font-family='Arial'%20font-size='24'%20fill='%23495057'%20dominant-baseline='middle'%20text-anchor='middle'%3EBanner%20da%20Promoção%20Aqui%3C/text%3E%3C/svg%3E" alt="Promoção">
        </div>
    </div>
</body>
</html>
