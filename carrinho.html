<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrinho de Compras - Loja de Impressões 3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">
                <h1><a href="index.html">Impressões 3D</a></h1>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="O que você procura?">
                <button>Buscar</button>
            </div>
            <div class="header-icons">
                <a href="#" title="Minha Conta">👤</a>
                <a href="carrinho.html" title="Carrinho">🛒 (<span id="cart-count">0</span>)</a>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">Produtos ▾</a>
                    <div class="dropdown-content">
                        <a href="#">Vases</a>
                        <a href="#">Action Figures</a>
                        <a href="#">Supports</a>
                        <a href="#">Decoração</a>
                    </div>
                </li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Promoções</a></li>
            </ul>
        </nav>
    </header>

    <main class="cart-container">
        <h2>Seu Carrinho de Compras</h2>
        <div id="cart-items-container">
            <!-- Itens do carrinho serão inseridos aqui pelo JavaScript -->
        </div>
        <div id="cart-summary">
            <div class="coupon-container">
                <input type="text" id="coupon-code" placeholder="Código do cupom">
                <button id="apply-coupon-btn">Aplicar</button>
            </div>
            <h3>Total: R$ <span id="cart-total">0.00</span></h3>
            <button id="clear-cart-btn">Limpar Carrinho</button>
            <button id="checkout-btn">Finalizar Compra</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 Loja de Impressões 3D</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
