<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://fonts.googleapis.com; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Referrer-Policy" content="no-referrer">
    <title>Loja de Impressões 3D</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Impressões 3D Incríveis</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
            <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section class="product-gallery">
            <h2>Produtos em Destaque</h2>
            <div class="gallery-container">
                <div class="product-item" data-id="1" data-name="Vaso Elegante" data-price="49.90">
                    <a href="produto.html" class="product-link">
                        <img src="images/produto1-placeholder.png" alt="Vaso Elegante">
                        <h3>Vaso Elegante</h3>
                    </a>
                    <p>R$ 49,90</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
                <div class="product-item" data-id="2" data-name="Action Figure" data-price="59.90">
                    <a href="produto.html" class="product-link">
                        <img src="images/produto2-placeholder.png" alt="Action Figure">
                        <h3>Action Figure</h3>
                    </a>
                    <p>R$ 59,90</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
                <div class="product-item" data-id="3" data-name="Suporte para Headset" data-price="39.90">
                    <a href="produto.html" class="product-link">
                        <img src="images/produto3-placeholder.png" alt="Suporte para Headset">
                        <h3>Suporte para Headset</h3>
                    </a>
                    <p>R$ 39,90</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Loja de Impressões 3D</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
