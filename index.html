<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Impressões 3D</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="top-bar">
            <div class="logo">
                <h1><a href="index.html">Impressões 3D</a></h1>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="O que você procura?">
                <button>Buscar</button>
            </div>
            <div class="header-icons">
                <a href="#" title="Minha Conta">👤</a>
                <a href="carrinho.html" title="Carrinho">🛒 (<span id="cart-count">0</span>)</a>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li class="dropdown">
                    <a href="#" class="dropbtn">Produtos ▾</a>
                    <div class="dropdown-content">
                        <a href="#">Vases</a>
                        <a href="#">Action Figures</a>
                        <a href="#">Supports</a>
                        <a href="#">Decoração</a>
                    </div>
                </li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Promoções</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="product-gallery">
            <h2>Produtos em Destaque</h2>
            <div class="gallery-container">
                <div class="product-item" data-id="1" data-name="Vaso Elegante" data-price="49.90">
                    <div class="product-image-container">
                        <a href="produto.html" class="product-link">
                            <img src="images/produto1-placeholder.png" alt="Vaso Elegante">
                        </a>
                        <div class="sale-tag">15% OFF</div>
                    </div>
                    <a href="produto.html" class="product-link">
                        <h3>Vaso Elegante</h3>
                    </a>
                    <div class="price-container">
                        <span class="old-price">R$ 59,90</span>
                        <span class="new-price">R$ 49,90</span>
                    </div>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
                <div class="product-item" data-id="2" data-name="Action Figure" data-price="59.90">
                    <a href="produto.html" class="product-link">
                        <img src="images/produto2-placeholder.png" alt="Action Figure">
                        <h3>Action Figure</h3>
                    </a>
                    <p>R$ 59,90</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
                <div class="product-item" data-id="3" data-name="Suporte para Headset" data-price="39.90">
                    <a href="produto.html" class="product-link">
                        <img src="images/produto3-placeholder.png" alt="Suporte para Headset">
                        <h3>Suporte para Headset</h3>
                    </a>
                    <p>R$ 39,90</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Loja de Impressões 3D</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
