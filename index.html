<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabacaria Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Tabacaria Online</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="#">Produtos</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
            <a href="carrinho.html">Carrinho (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section class="product-gallery">
            <h2>Produtos em Destaque</h2>
            <div class="gallery-container">
                <div class="product-item" data-id="1" data-name="Tabaco Orgânico" data-price="25.00">
                    <a href="produto.html?id=1" class="product-link">
                        <img src="images/tabaco-placeholder.png" alt="Tabaco Orgânico">
                        <h3>Tabaco Orgânico</h3>
                    </a>
                    <p>R$ 25,00</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
                <div class="product-item" data-id="2" data-name="Seda Clássica" data-price="5.00">
                    <a href="produto.html?id=2" class="product-link">
                        <img src="images/seda-placeholder.png" alt="Seda Clássica">
                        <h3>Seda Clássica</h3>
                    </a>
                    <p>R$ 5,00</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
                <div class="product-item" data-id="3" data-name="Isqueiro Maçarico" data-price="35.00">
                    <a href="produto.html?id=3" class="product-link">
                        <img src="images/isqueiro-placeholder.png" alt="Isqueiro Maçarico">
                        <h3>Isqueiro Maçarico</h3>
                    </a>
                    <p>R$ 35,00</p>
                    <button class="add-to-cart-btn">Adicionar ao Carrinho</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Tabacaria Online</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
